apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "cloudprober.fullname" . }}-test-connection"
  labels:
    {{- /* Keep test pods outside the workload selector so they are not adopted and deleted by the DaemonSet. */}}
    {{- omit (include "cloudprober.labels" . | fromYaml) "app.kubernetes.io/name" | toYaml | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "cloudprober.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
