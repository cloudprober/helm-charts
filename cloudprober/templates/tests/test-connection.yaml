apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "cloudprober.fullname" . }}-test-connection"
  labels:
    {{- /* Keep test pods outside the workload selector so they are not adopted and deleted by the DaemonSet. */}}
    {{- omit (include "cloudprober.labels" . | fromYaml) "app.kubernetes.io/name" | toYaml | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      # Retry until the service has a ready endpoint. helm install --wait does
      # not wait for a single-node DaemonSet, so the pod may still be starting.
      command: ['sh', '-c']
      args:
        - |
          for i in $(seq 30); do
            wget -T 2 -O /dev/null '{{ include "cloudprober.fullname" . }}:{{ .Values.service.port }}' && exit 0
            sleep 2
          done
          exit 1
  restartPolicy: Never
