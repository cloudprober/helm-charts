name: Helm Chart Lint and Release
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  helm-lint:
    name: Helm lint & testing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo hosting code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v3
      - name: Run helm lint
        run: helm lint cloudprober/.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          check-latest: true
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2
      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --chart-dirs . --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          ct lint --chart-dirs . --target-branch ${{ github.event.repository.default_branch }} \
            --check-version-increment=false --validate-maintainers=false 
      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.10.0
      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --chart-dirs . --target-branch ${{ github.event.repository.default_branch }}        

  # Releases on every push to main that changes what the chart ships, unless
  # the commit title contains "[no release]". Changes held back that way ship
  # with the next release. workflow_dispatch releases any pending changes and
  # ignores the marker.
  #
  # The chart version is computed here; contributors don't bump it.
  # MAJOR.MINOR = Chart.yaml version MAJOR.MINOR + appVersion MAJOR.MINOR
  # PATCH       = last release tag's PATCH in that MAJOR.MINOR + 1, else 0
  chart-release:
    name: Release chart
    runs-on: ubuntu-latest
    needs: [helm-lint]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Releases must not run in parallel: each one claims the next tag.
    concurrency:
      group: chart-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repo hosting code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Decide release and compute chart version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |-
          title=$(printf '%s\n' "$COMMIT_MESSAGE" | head -1)
          if [[ "$EVENT_NAME" == "push" && "$title" == *"[no release]"* ]]; then
            echo ">> Commit title has [no release], skipping"
            echo "release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          baseVersion=$(sed -n 's/^version: //p' cloudprober/Chart.yaml)
          appVersion=$(sed -n 's/^appVersion: //p' cloudprober/Chart.yaml | tr -d "'\"v ")
          bv=( ${baseVersion//./ } )
          cv=( ${appVersion//./ } )
          line="$((${bv[0]} + ${cv[0]})).$((${bv[1]} + ${cv[1]}))"
          echo ">> Base version: $baseVersion, app version: $appVersion, line: $line"

          # A re-run of a release that already tagged this commit reuses its tag.
          existing=$(git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [[ -n "$existing" ]]; then
            echo ">> HEAD is already tagged $existing, re-publishing it"
            echo "release=true" >> $GITHUB_OUTPUT
            echo "tagged=true" >> $GITHUB_OUTPUT
            echo "CHART_VERSION=$existing" >> $GITHUB_ENV
            exit 0
          fi

          lastTag=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo ">> Last release: ${lastTag:-none}"
          # Only changes to what the chart ships count; CI values and the
          # helm test hook don't affect installs.
          if [[ -n "$lastTag" ]] && git diff --quiet "$lastTag" HEAD -- cloudprober \
              ':(exclude)cloudprober/ci' ':(exclude)cloudprober/templates/tests'; then
            echo ">> No chart changes since $lastTag, skipping"
            echo "release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          lastPatch=$(git tag --list "$line.*" | grep -E "^${line//./\\.}\.[0-9]+$" | sed "s/^$line\.//" | sort -n | tail -1)
          newVersion="$line.$(( ${lastPatch:--1} + 1 ))"
          echo ">> New version: $newVersion"
          echo "release=true" >> $GITHUB_OUTPUT
          echo "tagged=false" >> $GITHUB_OUTPUT
          echo "CHART_VERSION=$newVersion" >> $GITHUB_ENV

      - name: Set up Helm
        if: steps.version.outputs.release == 'true'
        uses: azure/setup-helm@v3

      - name: Create tag
        if: steps.version.outputs.release == 'true' && steps.version.outputs.tagged != 'true'
        uses: actions/github-script@v5
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ env.CHART_VERSION }}',
              sha: context.sha
            })

      - name: Package chart and build index
        if: steps.version.outputs.release == 'true'
        run: |-
          git worktree add repo gh-pages
          cd repo
          helm package ../cloudprober/. --version=${CHART_VERSION} -d packages
          helm repo index . --url https://helm.cloudprober.org
          git add *
          git status

      - name: Push release
        if: steps.version.outputs.release == 'true'
        run: |-
          cd repo
          git add *
          git config user.name "Manu Garg"
          git config user.email "manugarg@gmail.com"
          git commit -m "[automated] Update helm charts repo" || exit 0
          git push

      - name: Push chart to GHCR (OCI)
        if: steps.version.outputs.release == 'true'
        run: |-
          helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          helm push repo/packages/cloudprober-${CHART_VERSION}.tgz oci://ghcr.io/cloudprober/charts
